# git-cliff configuration
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog\n
"""
body = """
{% if version %}\
    ## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}[**breaking**] {% endif %}\
          [{{ commit.message | upper_first }}](<REPO>/commit/{{ commit.id }})
    {%- endfor %}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
postprocessors = [
    { pattern = '<REPO>', replace = "https://github.com/kannika-io/same" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
    # Link pull request numbers such as "(#12)".
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](<REPO>/pull/${1}))" },
]
# Groups are prefixed with a hidden HTML comment so they sort in this order;
# the template strips it with `striptags`.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->🌟 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->🚀 Performance" },
    { message = "^refactor", group = "<!-- 3 -->🛠️ Refactor" },
    { message = "^docs?", group = "<!-- 4 -->📚 Documentation" },
    { message = "^test", group = "<!-- 5 -->🧪 Testing" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps\\)", group = "<!-- 7 -->📦 Dependencies" },
    { message = "^(chore|ci|build|style)", group = "<!-- 6 -->🧹 Miscellaneous Tasks" },
    { message = "^revert", group = "<!-- 8 -->⏮️ Revert" },
    { body = ".*security", group = "<!-- 9 -->🔐 Security" },
]
protect_breaking_commits = false
filter_commits = false
# Tags are plain semver without a "v" prefix.
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
