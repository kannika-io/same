name: Prepare release

# Bumps the crate version, prepends GitHub-generated release notes to
# CHANGELOG.md and opens a release PR. After merging, create the release on
# GitHub with the same tag; the tagged commit then already contains the
# changelog.
#
# See RELEASING.md. PRs opened with the default GITHUB_TOKEN do not trigger the Build workflow.
# Add a RELEASE_TOKEN secret (a PAT with repo scope) to get CI on release PRs.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 0.7.0
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Open release PR for ${{ inputs.version }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Bump version
        run: |
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          cargo update -p same
          grep -q "^version = \"${VERSION}\"" Cargo.toml

      - name: Update CHANGELOG.md
        run: scripts/update-changelog.sh "$VERSION"

      - name: Open pull request
        run: |
          branch="release/${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): prepare ${VERSION}"
          git push -u origin "$branch"
          gh label create release --description "Release preparation" --color 0E8A16 --force
          gh pr create \
            --title "chore(release): prepare ${VERSION}" \
            --label release \
            --body "$(printf 'Bumps the version to %s and adds the release notes to CHANGELOG.md.\n\nAfter merging, create the GitHub release with tag `%s` targeting `main`.' "$VERSION" "$VERSION")"
